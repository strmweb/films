<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title></title>
    <!-- Подключаем библиотеку HLS.js для воспроизведения m3u8 потоков -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed; /* Фиксируем тело страницы, чтобы убрать лишние скроллы в Instagram */
        }

        /* Адаптивный контейнер: на мобильных занимает весь экран, на ПК выглядит как аккуратное приложение */
        .stream-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            max-height: 100vh;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, height 0.2s ease;
        }

        @media (min-width: 481px) {
            .stream-container {
                height: 95vh;
                max-height: 900px;
                border-radius: 24px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            }
        }

        /* Видео занимает строго верхние 67% экрана устройства, подстраиваясь под любые пропорции */
        .video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 67%; 
            object-fit: contain; /* Сохраняет пропорции видео без искажений */
            background: #000;
        }

        /* Слой-накладка для сайта (открывается поверх плеера в той же зоне 67%) */
        .site-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 67%;
            z-index: 5; /* Находится поверх видео, но ниже чата */
            background: #000;
        }

        .site-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Панель чата снизу: занимает ровно 1/3 (33%) экрана на любом устройстве */
        .chat-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 33%; 
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 75%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0;
            z-index: 10;
        }

        /* Обертка чата заполняет всю ширину */
        .chat-box {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        /* Твой встроенный чат Cbox */
        .chat-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="stream-container" id="streamContainer">
        <!-- Слой с сайтом поверх плеера (занимает зону видео 67%) -->
        <div class="site-overlay">
            <iframe src="https://angliya-argentina-futbol.sbs" allowfullscreen></iframe>
        </div>

        <!-- Оригинальный плеер (остается на месте под сайтом) -->
        <video id="videoElement" class="video-player" autoplay playsinline controls></video>

        <!-- Чат снизу (33% высоты) -->
        <div class="chat-overlay">
            <div class="chat-box">
                
<iframe src="https://www5.cbox.ws/box/?boxid=967420&boxtag=E05Ods" width="100%" height="300" allowtransparency="yes" allow="autoplay" frameborder="0" marginheight="0" marginwidth="0" scrolling="auto"></iframe>	

            </div>
        </div>
    </div>

    <!-- Невидимый элемент для предотвращения засыпания телефона -->
    <audio id="keepAliveAudio" loop style="display:none;">
        <source src="data:audio/wav;base64,UklGRjIAAABXQVZFZm10IBIAAAABAAEAQB8AAEAfAAABAAgAZGF0YRAAAAAAAA==" type="audio/wav">
    </audio>

    <script>
        const videoSource = "https://.m3u8"; 

        const video = document.getElementById('videoElement');
        video.volume = 1.0;

        if (videoSource.endsWith('.m3u8')) {
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSource;
            } else if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoSource);
                hls.attachMedia(video);
            }
        } else {
            video.src = videoSource;
        }

        // Продвинутый фикс клавиатуры для Instagram WebView и мобильных браузеров
        const container = document.getElementById('streamContainer');
        const initialHeight = window.innerHeight;

        function handleResize() {
            const currentHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
            const heightDiff = initialHeight - currentHeight;

            // Если разница большая (появилась клавиатура, обычно > 130-150px)
            if (heightDiff > 130) {
                // Сжимаем контейнер по высоте вьюпорта или поднимаем его вверх
                container.style.height = currentHeight + 'px';
                window.scrollTo(0, 0);
            } else {
                // Возвращаем обратно, когда клавиатура закрылась
                container.style.height = '100%';
                window.scrollTo(0, 0);
            }
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', handleResize);
            window.visualViewport.addEventListener('scroll', handleResize);
        } else {
            window.addEventListener('resize', handleResize);
        }

        // Защита от ухода телефона в спящий режим (Wake Lock + фоновый аудио-сигнал + пинг)
        let wakeLock = null;
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                    });
                } catch (err) {}
            }
        }

        requestWakeLock();

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
            if (document.visibilityState === 'visible') {
                startKeepAlive();
            }
        });

        // Запуск фонового аудио для предотвращения засыпания системы
        const keepAliveAudio = document.getElementById('keepAliveAudio');
        function startKeepAlive() {
            if (keepAliveAudio.paused) {
                keepAliveAudio.play().catch(() => {});
            }
        }

        window.addEventListener('click', startKeepAlive, { once: true });
        window.addEventListener('touchstart', startKeepAlive, { once: true });
        setTimeout(startKeepAlive, 1000);

        // Дополнительный интервал для поддержания активного состояния процессора и предотвращения сна
        setInterval(() => {
            startKeepAlive();
            if ('wakeLock' in navigator && wakeLock === null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        }, 10000);
    </script>

</body>
</html>
