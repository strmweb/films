<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: fixed;
        }

        .stream-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 480px;
            background: #000;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 481px) {
            .stream-container {
                height: 95vh;
                max-height: 900px;
                border-radius: 24px;
                box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8);
            }
        }

        .video-player {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 67%; 
            object-fit: contain;
            background: #000;
        }

        .site-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 67%;
            z-index: 5;
            background: #0b0b0b;
        }

        .site-overlay iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .movie-landing-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 33%; 
            z-index: 8;
            background: rgba(11, 11, 11, 0.96);
            backdrop-filter: blur(12px);
            display: flex;
            flex-direction: column;
            padding: 0; 
            overflow-y: auto;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .brand-header {
            width: 100%;
            text-align: center;
            padding: 12px 0;
            background: rgba(18, 18, 18, 0.8);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            text-decoration: none;
            display: block;
            flex-shrink: 0;
            margin-bottom: 16px;
        }

        .brand-logo-text {
            font-size: 18px;
            font-weight: 850;
            letter-spacing: 12px;
            color: #ffffff;
            text-transform: uppercase;
            text-shadow: 0 2px 12px rgba(168, 85, 247, 0.5);
            transition: opacity 0.2s ease;
            width: 100%;
            text-align: center;
            padding-left: 12px;
        }

        .brand-header:hover .brand-logo-text {
            opacity: 0.8;
        }

        .landing-content-inner {
            display: flex;
            flex-direction: column;
            padding: 0 16px 16px 16px;
            flex-grow: 1;
        }

        .landing-top-bar {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
            flex-shrink: 0;
            align-items: center;
        }

        .landing-search-btn {
            background: linear-gradient(135deg, #7928ca 0%, #a855f7 100%);
            border: none;
            color: #ffffff;
            padding: 0 12px;
            height: 46px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 15px rgba(121, 40, 202, 0.4);
            transition: transform 0.2s ease, opacity 0.2s ease;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .landing-search-btn:active {
            transform: scale(0.98);
        }

        /* Стиль для квадратной кнопки случайного фильма (как у музыки и Telegram) */
        .landing-random-btn {
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 18px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .landing-random-btn:hover {
            background: rgba(37, 37, 37, 0.95);
            border-color: #a855f7;
        }

        .landing-random-btn:active {
            transform: scale(0.98);
        }

        .landing-music-btn {
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .landing-music-btn:hover {
            background: rgba(37, 37, 37, 0.95);
            border-color: #a855f7;
        }

        .landing-music-btn.active {
            background: rgba(168, 85, 247, 0.3);
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
        }

        .landing-music-btn:active {
            transform: scale(0.98);
        }

        .landing-music-btn svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .landing-telegram-btn {
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .landing-telegram-btn:hover {
            background: rgba(37, 37, 37, 0.95);
            border-color: #24a1de;
        }

        .landing-telegram-btn:active {
            transform: scale(0.98);
        }

        .landing-telegram-btn svg {
            width: 20px;
            height: 20px;
            fill: #24a1de;
        }

        .landing-input {
            width: 50px;
            min-width: 0;
            flex-grow: 1;
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 0 10px;
            height: 46px;
            border-radius: 14px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .landing-input:focus {
            border-color: #a855f7;
        }

        .music-player-view {

            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 4px 0;
            flex-grow: 1;
        }

        .music-player-view.active {
            display: flex;
        }

        .youtube-embed-wrapper {
            width: 100%;
            height: 210px;
            border-radius: 14px;
            overflow: hidden;
            background: #111;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .youtube-embed-wrapper iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .music-controls-bar {
            display: flex;
            gap: 12px;
            width: 100%;
        }

        .music-ctrl-btn {
            flex: 1;
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 12px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .music-ctrl-btn:hover {
            background: rgba(37, 37, 37, 0.95);
            border-color: #a855f7;
        }

        .music-ctrl-btn:active {
            transform: scale(0.98);
        }

        .equalizer-container {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 4px;
            height: 80px;
            width: 100%;
            padding: 8px 10px;
            background: rgba(18, 18, 18, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
        }

        .eq-bar {
            flex-grow: 1;
            height: 100%;
            background: linear-gradient(to top, #7928ca, #a855f7);
            border-radius: 4px;
            animation: equalize 1.2s ease-in-out infinite alternate;
            transform-origin: bottom;
        }

        .eq-bar:nth-child(1) { animation-duration: 0.7s; }
        .eq-bar:nth-child(2) { animation-duration: 0.4s; }
        .eq-bar:nth-child(3) { animation-duration: 0.9s; }
        .eq-bar:nth-child(4) { animation-duration: 0.5s; }
        .eq-bar:nth-child(5) { animation-duration: 0.8s; }
        .eq-bar:nth-child(6) { animation-duration: 0.6s; }
        .eq-bar:nth-child(7) { animation-duration: 1.0s; }
        .eq-bar:nth-child(8) { animation-duration: 0.45s; }
        .eq-bar:nth-child(9) { animation-duration: 0.85s; }
        .eq-bar:nth-child(10) { animation-duration: 0.65s; }
        .eq-bar:nth-child(11) { animation-duration: 0.75s; }
        .eq-bar:nth-child(12) { animation-duration: 0.55s; }
        .eq-bar:nth-child(13) { animation-duration: 0.95s; }
        .eq-bar:nth-child(14) { animation-duration: 0.5s; }
        .eq-bar:nth-child(15) { animation-duration: 0.8s; }

        @keyframes equalize {
            0% { transform: scaleY(0.25); }
            50% { transform: scaleY(1.0); }
            100% { transform: scaleY(0.45); }
        }

        .movies-list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .movies-list-container.hidden {
            display: none;
        }

        .movie-card {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .movie-btn {
            background: rgba(26, 26, 26, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #ffffff;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
            width: 100%;
        }

        .movie-btn:hover {
            background: rgba(37, 37, 37, 0.95);
            border-color: #7928ca;
        }

        .movie-btn-content {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-grow: 1;
            overflow: hidden;
        }

        .movie-poster {
            width: 38px;
            height: 38px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
            background: #1a1a1a;
        }

        .movie-btn span {
            color: #a855f7;
            font-size: 13px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .sub-buttons-container {
            display: none;
            flex-direction: column;
            gap: 6px;
            padding-left: 16px;
            border-left: 2px solid #7928ca;
            margin-top: 4px;
        }

        .movie-card.open .sub-buttons-container {
            display: flex;
        }

        .sub-movie-btn {
            background: rgba(18, 18, 18, 0.9);
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #e2e2e2;
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 14px;
            cursor: pointer;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .sub-movie-btn:hover {
            background: rgba(37, 37, 37, 0.95);
            border-color: #a855f7;
            color: #ffffff;
        }

        .sub-movie-btn span {
            color: #a855f7;
            font-size: 12px;
            flex-shrink: 0;
            margin-left: 8px;
        }

        .movie-btn.highlighted, .sub-movie-btn.highlighted {
            border-color: #a855f7 !important;
            background: rgba(168, 85, 247, 0.25) !important;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.5);
            transform: scale(1.02);
        }

        .chat-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 33%; 
            background: linear-gradient(to top, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.5) 75%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 0;
            z-index: 10;
        }

        .chat-box {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: transparent;
        }

        .chat-box iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
        }
    </style>
</head>

        let ytPlayer = null;
        let playlistUrls = [];
        let currentPlaylistIndex = 0;
        let isMusicOpen = false;

        let allParsedMovies = [];
        let renderedCount = 0;
        const pageSize = 20;

        const tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        const firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        function onYouTubeIframeAPIReady() {
            playlistUrls = rawPlaylistsText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
            if (playlistUrls.length === 0) return;

            currentPlaylistIndex = Math.floor(Math.random() * playlistUrls.length);
            const selectedListUrl = playlistUrls[currentPlaylistIndex];
            const listIdMatch = selectedListUrl.match(/[?&]list=([^#\&\?]+)/);
            const listId = listIdMatch ? listIdMatch[1] : '';

            ytPlayer = new YT.Player('youtubePlayerContainer', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'listType': 'playlist',
                    'list': listId,
                    'autoplay': 1,
                    'shuffle': 1,
                    'controls': 1,
                    'playsinline': 1
                },
                events: {
                    'onReady': (event) => {
                        event.target.setShuffle({ shuffle: true });
                        event.target.playVideo();
                    },
                    'onStateChange': (event) => {
                        if (event.data === YT.PlayerState.ENDED) {
                            nextSong();
                        }
                    }
                }
            });
        }

        function nextSong() {
            if (!ytPlayer || playlistUrls.length === 0) return;
            if (playlistUrls.length > 1) {
                let nextIdx;
                do {
                    nextIdx = Math.floor(Math.random() * playlistUrls.length);
                } while (nextIdx === currentPlaylistIndex);
                currentPlaylistIndex = nextIdx;
            } else {
                currentPlaylistIndex = 0;
            }
            const selectedListUrl = playlistUrls[currentPlaylistIndex];
            const listIdMatch = selectedListUrl.match(/[?&]list=([^#\&\?]+)/);
            const listId = listIdMatch ? listIdMatch[1] : '';
            if (listId) {
                ytPlayer.loadPlaylist({
                    list: listId,
                    listType: 'playlist',
                    index: Math.floor(Math.random() * 15),
                    suggestedQuality: 'medium'
                });
                ytPlayer.setShuffle({ shuffle: true });
                ytPlayer.playVideo();
            }
        }

        function toggleMusicPlayer() {
            isMusicOpen = !isMusicOpen;
            const musicBtn = document.getElementById('musicToggleBtn');
            const musicView = document.getElementById('musicPlayerView');
            const moviesList = document.getElementById('moviesListContainer');

            if (isMusicOpen) {
                musicBtn.classList.add('active');
                musicView.classList.add('active');
                moviesList.classList.add('hidden');
                if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                    ytPlayer.playVideo();
                }
            } else {
                musicBtn.classList.remove('active');
                musicView.classList.remove('active');
                moviesList.classList.remove('hidden');
                if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
                    ytPlayer.pauseVideo();
                }
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('siteIframe').src = "about:blank";
            if (window.location.hash) {
                history.replaceState(null, '', window.location.pathname);
            }

            const lines = rawMoviesText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            
            let movies = [];
            let currentMovie = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];

                if (line.startsWith('(') && line.endsWith(')')) {
                    const inner = line.slice(1, -1).trim();
                    const spaceIndex = inner.indexOf(' ');
                    if (spaceIndex !== -1 && currentMovie) {
                        currentMovie.subButtons.push({
                            url: inner.slice(0, spaceIndex).trim(),
                            title: inner.slice(spaceIndex + 1).trim()
                        });
                    }
                } else {
                    if (i + 1 < lines.length && !lines[i+1].startsWith('(')) {
                        if (currentMovie) {
                            movies.push(currentMovie);
                        }
                        
                        const titleLine = lines[i+1];
                        let title = titleLine;
                        let poster = "";
                        const firstSpace = titleLine.indexOf('http');
                        if (firstSpace !== -1) {
                            title = titleLine.slice(0, firstSpace).trim();
                            poster = titleLine.slice(firstSpace).trim();
                        }

                        currentMovie = {
                            url: lines[i],
                            title: title,
                            poster: poster,
                            subButtons: []
                        };
                        i++; 
                    }
                }
            }
            if (currentMovie) {
                movies.push(currentMovie);
            }

            movies.sort(() => Math.random() - 0.5);
            allParsedMovies = movies;

            renderMoreMovies(pageSize);

            const landingOverlay = document.getElementById('movieLanding');
            landingOverlay.addEventListener('scroll', () => {
                if (landingOverlay.scrollTop + landingOverlay.clientHeight >= landingOverlay.scrollHeight - 200) {
                    renderMoreMovies(pageSize);
                }
            });
        });

        function renderMoreMovies(count) {
            const container = document.getElementById('moviesListContainer');
            const endIndex = Math.min(renderedCount + count, allParsedMovies.length);
            
            if (renderedCount >= allParsedMovies.length) return;

            for (let i = renderedCount; i < endIndex; i++) {
                const movie = allParsedMovies[i];
                const card = document.createElement('div');
                card.className = 'movie-card';

                const btn = document.createElement('button');
                btn.className = 'movie-btn';
                btn.dataset.title = movie.title.toLowerCase();
                
                let innerHtmlContent = `<div class="movie-btn-content">`;
                if (movie.poster) {
                    innerHtmlContent += `<img src="${movie.poster}" class="movie-poster" alt="">`;
                }
                innerHtmlContent += `<span>${movie.title}</span></div>`;

                if (movie.subButtons.length > 0) {
                    innerHtmlContent += `<span>Развернуть ▼</span>`;
                    btn.innerHTML = innerHtmlContent;
                    btn.onclick = () => {
                        card.classList.toggle('open');
                        const spans = btn.querySelectorAll('span');
                        const arrowSpan = spans[spans.length - 1];
                        arrowSpan.textContent = card.classList.contains('open') ? 'Свернуть ▲' : 'Развернуть ▼';
                    };
                } else {
                    innerHtmlContent += `<span>Смотреть ▶</span>`;
                    btn.innerHTML = innerHtmlContent;
                    btn.onclick = () => openMovie(movie.url);
                }
                card.appendChild(btn);

                if (movie.subButtons.length > 0) {
                    const subContainer = document.createElement('div');
                    subContainer.className = 'sub-buttons-container';

                    movie.subButtons.forEach(sub => {
                        const subBtn = document.createElement('button');
                        subBtn.className = 'sub-movie-btn';
                        subBtn.dataset.title = sub.title.toLowerCase();
                        subBtn.innerHTML = `${sub.title} <span>Смотреть ▶</span>`;
                        subBtn.onclick = () => openMovie(sub.url);
                        subContainer.appendChild(subBtn);
                    });

                    card.appendChild(subContainer);
                }

                container.appendChild(card);
            }
            renderedCount = endIndex;
        }

        function filterMovies() {
            const query = document.getElementById('movieSearchInput').value.toLowerCase().trim();
            
            if (isMusicOpen && query.length > 0) {
                toggleMusicPlayer();
            }

            if (query.length < 3) {
                document.querySelectorAll('.movies-list-container button').forEach(btn => btn.classList.remove('highlighted'));
                return;
            }

            let found = false;
            document.querySelectorAll('.movies-list-container button').forEach(btn => {
                if ((btn.dataset.title || "").includes(query)) found = true;
            });

            if (!found && renderedCount < allParsedMovies.length) {
                renderMoreMovies(allParsedMovies.length);
            }

            const allButtons = document.querySelectorAll('.movies-list-container button');
            allButtons.forEach(btn => btn.classList.remove('highlighted'));

            let firstMatch = null;
            allButtons.forEach(btn => {
                const title = btn.dataset.title || "";
                if (title.includes(query)) {
                    btn.classList.add('highlighted');
                    
                    if (btn.classList.contains('sub-movie-btn')) {
                        const card = btn.closest('.movie-card');
                        if (card) {
                            card.classList.add('open');
                            const spans = card.querySelectorAll('.movie-btn span');
                            const arrowSpan = spans[spans.length - 1];
                            if (arrowSpan) arrowSpan.textContent = 'Свернуть ▲';
                        }
                    }

                    if (!firstMatch) {
                        firstMatch = btn;
                    }
                }
            });

            if (firstMatch) {
                firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        function openMovie(movieUrl) {
            history.pushState({ view: 'player' }, '', '#player');
            document.getElementById('siteIframe').src = movieUrl;
            hideAllOverlays();
        }

        function showAllOverlays() {
            const landing = document.getElementById('movieLanding');
            if (landing) {
                landing.style.display = 'flex';
                setTimeout(() => {
                    landing.style.opacity = '1';
                    landing.style.transform = 'scale(1)';
                }, 10);
            }
        }

        function hideAllOverlays() {
            const landing = document.getElementById('movieLanding');
            if (landing) {
                landing.style.opacity = '0';
                landing.style.transform = 'scale(0.98)';
                setTimeout(() => {
                    landing.style.display = 'none';
                }, 300);
            }
        }

        window.addEventListener('popstate', (event) => {
            showAllOverlays();
            document.getElementById('siteIframe').src = "about:blank";
        });

        const videoSource = "https://.m3u8"; 

        const video = document.getElementById('videoElement');
        video.volume = 1.0;

        if (videoSource.endsWith('.m3u8')) {
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSource;
            } else if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoSource);
                hls.attachMedia(video);
            }
        } else {
            video.src = videoSource;
        }

        const containerElem = document.getElementById('streamContainer');

        function updateLayoutForKeyboard() {
            if (window.visualViewport) {
                containerElem.style.height = window.visualViewport.height + 'px';
                window.scrollTo(0, 0);
            }
        }

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', updateLayoutForKeyboard);
            window.visualViewport.addEventListener('scroll', updateLayoutForKeyboard);
        }

        let wakeLock = null;
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    wakeLock.addEventListener('release', () => {
                        wakeLock = null;
                    });
                } catch (err) {}
            }
        }

        requestWakeLock();

        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await requestWakeLock();
            }
            if (document.visibilityState === 'visible') {
                startKeepAlive();
            }
        });

        const keepAliveAudio = document.getElementById('keepAliveAudio');
        function startKeepAlive() {
            if (keepAliveAudio.paused) {
                keepAliveAudio.play().catch(() => {});
            }
        }

        window.addEventListener('click', startKeepAlive, { once: true });
        window.addEventListener('touchstart', startKeepAlive, { once: true });
        setTimeout(startKeepAlive, 1000);

        setInterval(() => {
            startKeepAlive();
            if ('wakeLock' in navigator && wakeLock === null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        }, 10000);
    </script>

</body>
