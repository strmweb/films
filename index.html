        function onYouTubeIframeAPIReady() {
            isYouTubeApiLoaded = true;
            playlistUrls = rawPlaylistsText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
        }

        function initYouTubePlayer() {
            if (ytPlayer || playlistUrls.length === 0) return;

            currentPlaylistIndex = Math.floor(Math.random() * playlistUrls.length);
            const selectedListUrl = playlistUrls[currentPlaylistIndex];
            const listIdMatch = selectedListUrl.match(/[?&]list=([^#\&\?]+)/);
            const listId = listIdMatch ? listIdMatch[1] : '';

            const randomStartIndex = Math.floor(Math.random() * 35);

            ytPlayer = new YT.Player('youtubePlayerContainer', {
                height: '100%',
                width: '100%',
                playerVars: {
                    'listType': 'playlist',
                    'list': listId,
                    'index': randomStartIndex,
                    'autoplay': 1,
                    'shuffle': 1,
                    'controls': 1,
                    'playsinline': 1,
                    'enablejsapi': 1,
                    'modestbranding': 1,
                    'rel': 0,
                    'iv_load_policy': 3,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': (event) => {
                        event.target.setShuffle({ shuffle: true });
                        event.target.playVideoAt(randomStartIndex);
                    },
                    'onError': (event) => {
                        console.warn('Видео недоступно или заблокировано (ошибка ' + event.data + '), пропускаем...');
                        setTimeout(() => {
                            if (ytPlayer && typeof ytPlayer.nextVideo === 'function') {
                                ytPlayer.nextVideo();
                            } else {
                                nextSong();
                            }
                        }, 50);
                    },
                    'onStateChange': (event) => {
                        startKeepAlive();
                        if (event.data === YT.PlayerState.PAUSED && document.hidden) {
                            setTimeout(() => {
                                if (document.hidden && ytPlayer && typeof ytPlayer.playVideo === 'function') {
                                    ytPlayer.playVideo();
                                }
                            }, 300);
                        }
                        if (event.data === YT.PlayerState.ENDED) {
                            nextSong();
                        }
                    }
                }
            });
        }

        function nextSong() {
            startKeepAlive();
            if (!ytPlayer || playlistUrls.length === 0) return;

            try {
                if (typeof ytPlayer.nextVideo === 'function' && Math.random() > 0.3) {
                    ytPlayer.nextVideo();
                    return;
                }
            } catch (e) {}

            let nextIdx;
            do {
                nextIdx = Math.floor(Math.random() * playlistUrls.length);
            } while (nextIdx === currentPlaylistIndex && playlistUrls.length > 1);
            
            currentPlaylistIndex = nextIdx;
            const selectedListUrl = playlistUrls[currentPlaylistIndex];
            const listIdMatch = selectedListUrl.match(/[?&]list=([^#\&\?]+)/);
            const listId = listIdMatch ? listIdMatch[1] : '';
            
            if (listId) {
                const randomStartIndex = Math.floor(Math.random() * 40);
                
                ytPlayer.cuePlaylist({
                    list: listId,
                    listType: 'playlist',
                    index: randomStartIndex,
                    suggestedQuality: 'small'
                });
                ytPlayer.setShuffle({ shuffle: true });
                ytPlayer.playVideoAt(randomStartIndex);
            }
        }

        function prevSong() {
            startKeepAlive();
            if (!ytPlayer) return;
            if (typeof ytPlayer.previousVideo === 'function') {
                ytPlayer.previousVideo();
            } else {
                nextSong();
            }
        }

        function toggleMusicPlayer() {
            startKeepAlive();
            isMusicOpen = !isMusicOpen;
            const musicBtn = document.getElementById('musicToggleBtn');
            const musicView = document.getElementById('musicPlayerView');
            const moviesList = document.getElementById('moviesListContainer');
            const radioIframe = document.getElementById('radioIframe');

            if (isMusicOpen) {
                history.pushState({ view: 'music' }, '', '#music');
                
                radioIframe.src = "about:blank";
                radioIframe.classList.remove('active');

                musicBtn.classList.add('active');
                musicView.classList.add('active');
                moviesList.classList.add('hidden');

                if (!ytPlayer && isYouTubeApiLoaded) {
                    initYouTubePlayer();
                } else if (ytPlayer && typeof ytPlayer.playVideo === 'function') {
                    ytPlayer.playVideo();
                }
            } else {
                closeMusicPlayerState();
            }
            shuffleAndResetMovies();
        }

        function closeMusicPlayerState() {
            isMusicOpen = false;
            const musicBtn = document.getElementById('musicToggleBtn');
            const musicView = document.getElementById('musicPlayerView');
            const moviesList = document.getElementById('moviesListContainer');

            musicBtn.classList.remove('active');
            musicView.classList.remove('active');
            moviesList.classList.remove('hidden');
            if (ytPlayer && typeof ytPlayer.pauseVideo === 'function') {
                ytPlayer.pauseVideo();
            }
        }

        function shuffleAndResetMovies() {
            if (allParsedMovies.length > 0) {
                allParsedMovies.sort(() => Math.random() - 0.5);
                const container = document.getElementById('moviesListContainer');
                container.innerHTML = '';
                renderedCount = 0;
                renderMoreMovies(pageSize);
                const landingWrapper = document.getElementById('landingScrollWrapper');
                if (landingWrapper) landingWrapper.scrollTop = 0;
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const radioIframe = document.getElementById('radioIframe');
            radioIframe.src = "https://directory.shoutcast.com/";
            radioIframe.classList.add('active');

            const hashValue = decodeURIComponent(window.location.hash.replace('#', '').trim());
            if (hashValue && !['music', 'player', 'radio'].includes(hashValue.toLowerCase())) {
                const searchInput = document.getElementById('movieSearchInput');
                if (searchInput) {
                    searchInput.value = hashValue;
                }
            } else if (window.location.hash && !['#music', '#player', '#radio'].includes(window.location.hash)) {
                history.replaceState(null, '', window.location.pathname);
            }

            const lines = rawMoviesText.split('\n').map(line => line.trim()).filter(line => line.length > 0);
            let movies = [];
            let currentMovie = null;

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                if (line.startsWith('(') && line.endsWith(')')) {
                    const inner = line.slice(1, -1).trim();
                    const spaceIndex = inner.indexOf(' ');
                    if (spaceIndex !== -1 && currentMovie) {
                        currentMovie.subButtons.push({
                            url: inner.slice(0, spaceIndex).trim(),
                            title: inner.slice(spaceIndex + 1).trim()
                        });
                    }
                } else {
                    if (i + 1 < lines.length && !lines[i+1].startsWith('(')) {
                        if (currentMovie) movies.push(currentMovie);
                        const titleLine = lines[i+1];
                        let title = titleLine;
                        let poster = "";
                        const firstSpace = titleLine.indexOf('http');
                        if (firstSpace !== -1) {
                            title = titleLine.slice(0, firstSpace).trim();
                            poster = titleLine.slice(firstSpace).trim();
                        }
                        currentMovie = { url: lines[i], title: title, poster: poster, subButtons: [] };
                        i++; 
                    }
                }
            }
            if (currentMovie) movies.push(currentMovie);

            allParsedMovies = movies;
            shuffleAndResetMovies();

            if (hashValue && !['music', 'player', 'radio'].includes(hashValue.toLowerCase())) {
                filterMovies();
            }

            const landingWrapper = document.getElementById('landingScrollWrapper');
            landingWrapper.addEventListener('scroll', () => {
                if (landingWrapper.scrollTop + landingWrapper.clientHeight >= landingWrapper.scrollHeight - 200) {
                    renderMoreMovies(pageSize);
                }
            });

            window.addEventListener('message', (event) => {
                if (event.data === 'video_played' || event.data === 'play') {
                    startKeepAlive();
                    const rFrame = document.getElementById('radioIframe');
                    rFrame.src = "about:blank";
                    rFrame.classList.remove('active');
                }
            });
        });

        function renderMoreMovies(count) {
            const container = document.getElementById('moviesListContainer');
            const endIndex = Math.min(renderedCount + count, allParsedMovies.length);
            if (renderedCount >= allParsedMovies.length) return;

            for (let i = renderedCount; i < endIndex; i++) {
                const movie = allParsedMovies[i];
                const card = document.createElement('div');
                card.className = 'movie-card';

                const btn = document.createElement('button');
                btn.className = 'movie-btn';
                btn.dataset.title = movie.title.toLowerCase();
                
                let innerHtmlContent = `<div class="movie-btn-content">`;
                if (movie.poster) innerHtmlContent += `<img src="${movie.poster}" class="movie-poster" alt="">`;
                innerHtmlContent += `<span>${movie.title}</span></div>`;

                if (movie.subButtons.length > 0) {
                    innerHtmlContent += `<span>Развернуть ▼</span>`;
                    btn.innerHTML = innerHtmlContent;
                    btn.onclick = () => {
                        startKeepAlive();
                        card.classList.toggle('open');
                        const spans = btn.querySelectorAll('span');
                        spans[spans.length - 1].textContent = card.classList.contains('open') ? 'Свернуть ▲' : 'Развернуть ▼';
                    };
                } else {
                    innerHtmlContent += `<span>Смотреть ▶</span>`;
                    btn.innerHTML = innerHtmlContent;
                    btn.onclick = () => openMovie(movie.url);
                }
                card.appendChild(btn);

                if (movie.subButtons.length > 0) {
                    const subContainer = document.createElement('div');
                    subContainer.className = 'sub-buttons-container';
                    movie.subButtons.forEach(sub => {
                        const subBtn = document.createElement('button');
                        subBtn.className = 'sub-movie-btn';
                        subBtn.dataset.title = sub.title.toLowerCase();
                        subBtn.innerHTML = `${sub.title} <span>Смотреть ▶</span>`;
                        subBtn.onclick = () => openMovie(sub.url);
                        subContainer.appendChild(subBtn);
                    });
                    card.appendChild(subContainer);
                }
                container.appendChild(card);
            }
            renderedCount = endIndex;
        }

        function filterMovies() {
            startKeepAlive();
            const query = document.getElementById('movieSearchInput').value.toLowerCase().trim();
            if (isMusicOpen && query.length > 0) {
                toggleMusicPlayer();
            }
            if (query.length < 3) {
                document.querySelectorAll('.movies-list-container button').forEach(btn => btn.classList.remove('highlighted'));
                return;
            }
            let found = false;
            document.querySelectorAll('.movies-list-container button').forEach(btn => {
                if ((btn.dataset.title || "").includes(query)) found = true;
            });
            if (!found && renderedCount < allParsedMovies.length) {
                renderMoreMovies(allParsedMovies.length);
            }
            const allButtons = document.querySelectorAll('.movies-list-container button');
            allButtons.forEach(btn => btn.classList.remove('highlighted'));
            let firstMatch = null;
            allButtons.forEach(btn => {
                if ((btn.dataset.title || "").includes(query)) {
                    btn.classList.add('highlighted');
                    if (btn.classList.contains('sub-movie-btn')) {
                        const card = btn.closest('.movie-card');
                        if (card) {
                            card.classList.add('open');
                            const spans = card.querySelectorAll('.movie-btn span');
                            if (spans.length) spans[spans.length - 1].textContent = 'Свернуть ▲';
                        }
                    }
                    if (!firstMatch) firstMatch = btn;
                }
            });
            if (firstMatch) firstMatch.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function openMovie(movieUrl) {
            startKeepAlive();
            if (isMusicOpen) closeMusicPlayerState();
            history.pushState({ view: 'player' }, '', '#player');
            const siteIframe = document.getElementById('siteIframe');
            const radioIframe = document.getElementById('radioIframe');
            
            radioIframe.src = "about:blank";
            radioIframe.classList.remove('active');

            siteIframe.src = movieUrl;
            siteIframe.classList.add('active');
            hideAllOverlays();
        }

        function openRadio() {
            startKeepAlive();
            if (isMusicOpen) closeMusicPlayerState();
            history.pushState({ view: 'radio' }, '', '#radio');
            const siteIframe = document.getElementById('siteIframe');
            const radioIframe = document.getElementById('radioIframe');
            
            siteIframe.classList.remove('active');
            siteIframe.src = "about:blank";

            radioIframe.src = "https://directory.shoutcast.com/";
            radioIframe.classList.add('active');
            hideAllOverlays();
        }

        function showAllOverlays() {
            startKeepAlive();
            if (isMusicOpen) {
                closeMusicPlayerState();
            }
            const landing = document.getElementById('movieLanding');
            if (landing) landing.style.display = 'flex';
            
            const siteIframe = document.getElementById('siteIframe');
            siteIframe.classList.remove('active');
            siteIframe.src = "about:blank";

            const radioIframe = document.getElementById('radioIframe');
            
            if (!radioIframe.classList.contains('active') && radioIframe.src !== "https://directory.shoutcast.com/") {
                radioIframe.src = "https://directory.shoutcast.com/";
            }
            radioIframe.classList.add('active');
            shuffleAndResetMovies();
        }

        window.addEventListener('popstate', (event) => {
            showAllOverlays();
        });

        window.addEventListener('hideAllOverlays', hideAllOverlays);

        function hideAllOverlays() {
            const landing = document.getElementById('movieLanding');
            if (landing) landing.style.display = 'none';
        }

        const videoSource = "https://.m3u8"; 
        const video = document.getElementById('videoElement');
        video.volume = 1.0;

        if (videoSource.endsWith('.m3u8')) {
            if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = videoSource;
            } else if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(videoSource);
                hls.attachMedia(video);
            }
        } else {
            video.src = videoSource;
        }

        let wakeLock = null;
        async function requestWakeLock(event) {
            if ('wakeLock' in navigator) {
                try { wakeLock = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }
        requestWakeLock();

        const keepAliveAudio = document.getElementById('keepAliveAudio');
        function startKeepAlive() {
            if (keepAliveAudio) {
                keepAliveAudio.play().catch(() => {});
            }
        }

        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                startKeepAlive();
                requestWakeLock();
            }
        });

        window.addEventListener('click', startKeepAlive, { once: true });
        window.addEventListener('touchstart', startKeepAlive, { once: true });
        setTimeout(startKeepAlive, 1000);
    </script>
</body>
</html>
